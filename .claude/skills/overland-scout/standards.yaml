# standards.yaml: generated from the Google Docs in 'Industry Standard Web App Playbook v2' (content at v2.1, 2026-11-13).
# The docs are the human source of truth. Regenerate after any doc change, then run the drift check in 03 Check ID Index.
version: 2.1
generated: 2026-11-13
rules:
  applies_if: "A standard applies when any listed questionnaire key is yes. 'always' means no key is needed."
  stage: "From the Maturity Roadmap (stage_source: roadmap). Otherwise Error -> launch, Warn or Review -> growth (stage_source: rule)."
  ids: "L<layer>.<kebab-slug>. Permanent: never renamed, renumbered or reused. Retire in 03 Check ID Index."
  threshold: "'Pass/fail as stated' means the standard text is the test."
  severity_by_stage: "Optional. When present it overrides severity per maturity stage (launch, growth, scale); severity stays the plain enum shown at the standard's own stage."
